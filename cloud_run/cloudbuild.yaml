# GCP Cloud Build → Cloud Run deploy pipeline
# Trigger: GitHub push to main (configured in Cloud Build trigger UI)
substitutions:
  _SERVICE: market-insight-api
  _REGION: asia-northeast3
  _REPO: gcr.io/${PROJECT_ID}

steps:
  # docker build/push run with cwd = cloud_run/ so Dockerfile + app/ are resolvable
  # when this config is submitted from the repo root (`gcloud builds submit --config cloud_run/cloudbuild.yaml`).
  - name: gcr.io/cloud-builders/docker
    dir: cloud_run
    args: ['build', '-t', '${_REPO}/${_SERVICE}:${SHORT_SHA}', '-t', '${_REPO}/${_SERVICE}:latest', '.']
  - name: gcr.io/cloud-builders/docker
    dir: cloud_run
    args: ['push', '--all-tags', '${_REPO}/${_SERVICE}']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated  # public API + JWT-gated routes
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --timeout=300
      - --set-env-vars=GCP_PROJECT=${PROJECT_ID},FIREBASE_PROJECT=${PROJECT_ID}

images:
  - '${_REPO}/${_SERVICE}:${SHORT_SHA}'
  - '${_REPO}/${_SERVICE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
