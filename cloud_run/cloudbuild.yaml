# GCP Cloud Build → Cloud Run deploy pipeline
# Trigger: GitHub push to main (configured in Cloud Build trigger UI)
substitutions:
  _SERVICE: market-insight-api
  _REGION: asia-northeast3
  _REPO: gcr.io/${PROJECT_ID}
  # CSV of allowed origins — pass via trigger substitution:
  #   --substitutions=_CORS_ORIGINS=https://<your-hosting>.web.app
  # Default "*" keeps local/dev unblocked; production triggers MUST override.
  _CORS_ORIGINS: '*'

steps:
  # docker build/push run with cwd = cloud_run/ so Dockerfile + app/ are resolvable
  # when this config is submitted from the repo root.
  - name: gcr.io/cloud-builders/docker
    dir: cloud_run
    args: ['build', '-t', '${_REPO}/${_SERVICE}:${SHORT_SHA}', '-t', '${_REPO}/${_SERVICE}:latest', '.']
  - name: gcr.io/cloud-builders/docker
    dir: cloud_run
    args: ['push', '--all-tags', '${_REPO}/${_SERVICE}']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated  # public API + JWT-gated routes
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --timeout=300
      # Single source of truth — PROJECT_ID covers GCP/Firestore/Auth audience.
      # CORS_ORIGINS must be explicit so startup invariant check passes.
      - --set-env-vars=PROJECT_ID=${PROJECT_ID},CORS_ORIGINS=${_CORS_ORIGINS}

images:
  - '${_REPO}/${_SERVICE}:${SHORT_SHA}'
  - '${_REPO}/${_SERVICE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
