# GCP Cloud Build -> Cloud Run deploy pipeline
# Trigger: GitHub push to main OR manual `gcloud builds submit`.
#
# Why this layout:
# - Avoid ${SHORT_SHA} — empty on manual submits, only set for trigger-driven builds.
# - Avoid nested user substitutions that reference ${PROJECT_ID} — inline instead.
# - _TAG user substitution gives a stable tag (default "latest"); override via
#     gcloud builds submit ... --substitutions=_TAG=v1
# - BUILD_ID is always defined (manual + trigger) and is used as the immutable
#   image tag so each build has a unique reference, with "latest" floating tag.

substitutions:
  _SERVICE: market-insight-api
  _REGION: asia-northeast3
  _TAG: latest                        # human-friendly mutable tag
  # CSV of allowed origins (콤마 구분). 명시 도메인 고정 — '*' 금지.
  #   이유: allow_credentials=True + ACAO '*' = 브라우저 credentials 요청 차단 (CORS 버그).
  #   ⚠️ 콤마 값은 set-env-vars 기본 콤마 구분과 충돌 → 아래 deploy step 에서 ^##^ 커스텀 구분자 사용.
  _CORS_ORIGINS: 'https://foodncare-a2c54.web.app,https://foodncare-a2c54.firebaseapp.com'
  # Firebase Auth 프로젝트 — GCP 프로젝트($PROJECT_ID)와 분리.
  #   토큰 aud 검증용. GCP=foodncare 이지만 Firebase Auth=foodncare-a2c54 이므로 명시.
  _FIREBASE_PROJECT: foodncare-a2c54

steps:
  # 1) Build (cwd = cloud_run/ so Dockerfile + app/ resolve).
  - name: gcr.io/cloud-builders/docker
    id: build
    dir: cloud_run
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}:${_TAG}
      - .

  # 2) Push both tags.
  - name: gcr.io/cloud-builders/docker
    id: push
    waitFor: ['build']
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/${_SERVICE}

  # 3) Deploy to Cloud Run by immutable tag ($BUILD_ID) for traceability.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    waitFor: ['push']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --timeout=300
      # PROJECT_ID = GCP/Firestore. FIREBASE_PROJECT_ID = Firebase Auth(aud) 분리. CORS_ORIGINS = 허용 origin.
      # ^##^ = gcloud 커스텀 구분자 — CORS_ORIGINS 값의 콤마(다중 도메인)가 env 구분자로 오인되지 않도록 함.
      - --set-env-vars=^##^PROJECT_ID=$PROJECT_ID##FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT}##CORS_ORIGINS=${_CORS_ORIGINS}

# Declare images so Cloud Build records them as build artifacts.
images:
  - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
  - gcr.io/$PROJECT_ID/${_SERVICE}:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
